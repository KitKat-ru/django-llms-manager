name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
      - run: uv sync --only-group dev
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
      - run: uv sync --only-group dev
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  compatibility:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # All supported pairs for the Python and Django series declared by the package.
        include:
          - { python: "3.10", django: "4.2" }
          - { python: "3.10", django: "5.0" }
          - { python: "3.10", django: "5.1" }
          - { python: "3.10", django: "5.2" }
          - { python: "3.11", django: "4.2" }
          - { python: "3.11", django: "5.0" }
          - { python: "3.11", django: "5.1" }
          - { python: "3.11", django: "5.2" }
          - { python: "3.12", django: "4.2" }
          - { python: "3.12", django: "5.0" }
          - { python: "3.12", django: "5.1" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.12", django: "6.0" }
          - { python: "3.12", django: "6.1" }
          - { python: "3.13", django: "5.1" }
          - { python: "3.13", django: "5.2" }
          - { python: "3.13", django: "6.0" }
          - { python: "3.13", django: "6.1" }
          - { python: "3.14", django: "5.2" }
          - { python: "3.14", django: "6.0" }
          - { python: "3.14", django: "6.1" }
          - { python: "3.15", django: "6.1" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - run: uv venv
      - run: uv pip install --group test dist/*.whl "Django~=${{ matrix.django }}.0"
      - name: Check installed wheel outside the source directory
        run: |
          cp -R tests "$RUNNER_TEMP/"
          cp pyproject.toml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m django check --settings=tests.settings
          "$GITHUB_WORKSPACE/.venv/bin/python" -m django makemigrations llms_manager --check --dry-run --settings=tests.settings
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest
