{% extends "admin/base_site.html" %}
{% load admin_urls i18n static %}

{% block extrastyle %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'llms_manager/admin.css' %}">
{% endblock %}

{% block breadcrumbs %}
  <div class="breadcrumbs">
    <a href="{% url 'admin:index' %}">{% translate "Home" %}</a>
    &rsaquo; <a href="{% url opts|admin_urlname:'changelist' %}">{{ opts.verbose_name_plural }}</a>
    {% if document %}
      &rsaquo; <a href="{% url opts|admin_urlname:'change' object_id=document.pk %}">{{ document }}</a>
    {% endif %}
    &rsaquo; {{ title }}
  </div>
{% endblock %}
