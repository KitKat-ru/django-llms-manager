[project]
name = "django-llms-manager"
version = "0.1.1"
description = "Manage llms.txt content for AI assistants through the Django admin."
readme = "README.md"
authors = [{ name = "Artem Fabrikov", email = "a.fabrikov1406@yandex.ru" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/KitKat-ru/django-llms-manager"
Repository = "https://github.com/KitKat-ru/django-llms-manager"
Issues = "https://github.com/KitKat-ru/django-llms-manager/issues"

[dependency-groups]
dev = [
    { include-group = "test" },
    "pre-commit>=4.0",
    "ruff==0.16.10",
    "twine>=6.0",
]
test = [
    "pytest>=8.0,<10",
    "pytest-django>=4.13,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
django_find_project = false

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llms_manager"
module-root = ""

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["W", "I", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Django migrations declare shared dependency and operation lists.
"llms_manager/migrations/*.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["llms_manager"]
